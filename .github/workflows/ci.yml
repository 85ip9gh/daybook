name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet tool restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet ef migrations has-pending-model-changes --project src/Ledger.Api --configuration Release --no-build
      - run: dotnet test --no-build --configuration Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file src/Ledger.Api/Dockerfile --tag daybook-api:ci .
      - run: docker build --tag daybook-web:ci web
      - run: docker run --rm --add-host api:127.0.0.1 daybook-web:ci nginx -t
      - run: docker compose --file deploy/compose.yaml config --quiet
        env:
          MSSQL_SA_PASSWORD: ci
          LEDGER_JWT_KEY: ci
          LEDGER_ADMIN_PASSWORD: ci
          LEDGER_BIND: 127.0.0.1:8080
