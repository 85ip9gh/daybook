name: ledger

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_MEMORY_LIMIT_MB: "1536"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?}
    volumes:
      - sqldata:/var/opt/mssql
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: src/Ledger.Api/Dockerfile
    image: ledger-api:local
    environment:
      ConnectionStrings__Ledger: Server=db;Database=Ledger;User Id=sa;Password=${MSSQL_SA_PASSWORD:?};TrustServerCertificate=True
      Jwt__SigningKey: ${LEDGER_JWT_KEY:?}
      Ledger__MigrateOnStartup: "true"
      Ledger__FirstAdmin__UserName: admin
      Ledger__FirstAdmin__Password: ${LEDGER_ADMIN_PASSWORD:?}
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    restart: unless-stopped

  web:
    build:
      context: ../web
    image: ledger-web:local
    ports:
      - ${LEDGER_BIND:?}:8080
    depends_on:
      - api
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 64m
    restart: unless-stopped

volumes:
  sqldata:
