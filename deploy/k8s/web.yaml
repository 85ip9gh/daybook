apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: daybook
  labels:
    app.kubernetes.io/name: daybook-web
    app.kubernetes.io/part-of: daybook
spec:
  selector:
    app.kubernetes.io/name: daybook-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: daybook
  labels:
    app.kubernetes.io/name: daybook-web
    app.kubernetes.io/part-of: daybook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: daybook-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daybook-web
        app.kubernetes.io/part-of: daybook
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: daybook-web:g7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: config
          configMap:
            name: web-config
