apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: daybook
  labels:
    app.kubernetes.io/name: daybook-seed
    app.kubernetes.io/part-of: daybook
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daybook-seed
        app.kubernetes.io/part-of: daybook
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: node:24-alpine
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /seed/seed-demo.mjs
          env:
            - name: LEDGER_API
              value: http://api:8080
            - name: LEDGER_DEMO_USERS
              value: /tmp/demo-users.json
            - name: LEDGER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daybook
                  key: LEDGER_ADMIN_PASSWORD
            - name: LEDGER_DEMO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daybook
                  key: LEDGER_DEMO_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: script
              mountPath: /seed
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: seed-script
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
