apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: daybook
  labels:
    app.kubernetes.io/name: daybook-db
    app.kubernetes.io/part-of: daybook
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: daybook-db
  ports:
    - name: sql
      port: 1433
      targetPort: sql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: daybook
  labels:
    app.kubernetes.io/name: daybook-db
    app.kubernetes.io/part-of: daybook
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: daybook-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: daybook-db
        app.kubernetes.io/part-of: daybook
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
          imagePullPolicy: IfNotPresent
          ports:
            - name: sql
              containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Express
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "1536"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daybook
                  key: MSSQL_SA_PASSWORD
            - name: LEDGER_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: daybook
                  key: LEDGER_APP_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: sql
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: daybook-db
          app.kubernetes.io/part-of: daybook
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
